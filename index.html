<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>KESELA</title>
  <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1c1a" media="(prefers-color-scheme: dark)">

  <!-- ホーム画面に追加したときの設定（iPhone） -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="KESELA">

  <script>
    // 文字の大きさ（設定画面で変更）を、表示の前に反映する
    // テーマも同じく表示の前に反映する
    try {
      var fs = Number(localStorage.getItem('yuteli.fontScale')); if (fs > 0) document.documentElement.style.setProperty('--fs', String(Math.min(fs, 1.1)));
      var th = localStorage.getItem('yuteli.theme'); if (th) document.documentElement.setAttribute('data-theme', th);
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/themes.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="app-header">
    <h1 id="screen-title">KESELA</h1>
    <!-- 設定（下のタブから移動） -->
    <a href="#/settings" class="header-btn" id="settings-btn" data-route="settings" aria-label="設定">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </a>
  </header>

  <main id="screen" class="screen" tabindex="-1"></main>

  <nav class="tabbar" aria-label="メイン">
    <a href="#/goals" data-route="goals">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4"/><path d="M5 4h12l-2.5 4.5L17 13H5"/></svg>
      <span data-i18n>目標</span>
    </a>
    <a href="#/list" data-route="list">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>
      <span data-i18n>リスト</span>
    </a>
    <a href="#/stock" data-route="stock">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7l8-4 8 4v10l-8 4-8-4z"/><path d="M4 7l8 4 8-4M12 11v10"/></svg>
      <span data-i18n>在庫</span>

    <a href="#/prices" data-route="prices">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.5"/></svg>
      <span data-i18n>価格</span>
    </a>
    <a href="#/meals" data-route="meals">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11h18a9 9 0 0 1-18 0z"/><path d="M8 7c0-1.5 1-1.5 1-3M12 7c0-1.5 1-1.5 1-3M16 7c0-1.5 1-1.5 1-3"/></svg>
      <span data-i18n>食事</span>
    </a>
    <a href="#/budget" data-route="budget">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a1 1 0 0 1-1-1z"/><path d="M4 7l11-3v3"/><circle cx="16" cy="13.5" r="1.2"/></svg>
      <span data-i18n>家計</span>
    </a>
  </nav>

  <noscript>このアプリを使うには JavaScript を有効にしてください。</noscript>
</body>
</html>
